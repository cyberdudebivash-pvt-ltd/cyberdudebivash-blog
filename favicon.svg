<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="shield" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#00ffe0"/>
      <stop offset="100%" stop-color="#0099ff"/>
    </linearGradient>
  </defs>
  <!-- Dark rounded-square app tile: reads on both light and dark browser tabs -->
  <rect x="0" y="0" width="64" height="64" rx="13" fill="#07090f"/>
  <rect x="1.5" y="1.5" width="61" height="61" rx="11.5" fill="none" stroke="#00ffe0" stroke-width="1" opacity="0.25"/>
  <!-- Sentinel shield -->
  <path d="M32 9 L51 16 L51 34 Q51 49 32 57 Q13 49 13 34 L13 16 Z" fill="url(#shield)"/>
  <path d="M32 9 L51 16 L51 34 Q51 49 32 57 Q13 49 13 34 L13 16 Z" fill="none" stroke="#7dffe8" stroke-width="1" opacity="0.5"/>
  <!-- Keyhole (brand lock), dark cut-out for strong contrast -->
  <circle cx="32" cy="30" r="7.5" fill="#07090f"/>
  <rect x="28.5" y="30" width="7" height="14" rx="3.5" fill="#07090f"/>
  <circle cx="32" cy="30" r="3.4" fill="#00ffe0"/>
</svg>
