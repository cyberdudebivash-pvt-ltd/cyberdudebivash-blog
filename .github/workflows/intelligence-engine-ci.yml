name: "🧠 SENTINEL APEX — Intelligence Engine CI"

on:
  push:
    branches: [main]
    paths:
      - 'Sentinel-APEX/engine/**'
      - '.github/workflows/intelligence-engine-ci.yml'
  pull_request:
    branches: [main]
    paths:
      - 'Sentinel-APEX/engine/**'
      - '.github/workflows/intelligence-engine-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: intelligence-engine-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  engine-tests:
    name: "Engine Test Suite"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: "🟢 Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "📦 Install Node dependencies"
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: "🧪 Run engine test suite (offline)"
        working-directory: Sentinel-APEX/engine
        run: python3 -m pytest tests/ -v

      - name: "🔬 Compile check"
        working-directory: Sentinel-APEX/engine
        run: python3 -m py_compile sentinel_engine/*.py cli.py
