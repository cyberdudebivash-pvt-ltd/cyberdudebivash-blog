name: "💾 SENTINEL APEX — Customer Data Backup"

# Encrypted operational safety snapshot. GitHub Actions is not the durable
# backup authority. Pre-revenue retention policy is enforced here: every
# Actions artifact expires after seven days; long-term customer backup design
# requires a separately approved storage/control plane.

on:
  schedule:
    - cron: '14 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backup-customer-data
  cancel-in-progress: false

jobs:
  backup:
    name: "Backup Customer Data"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "🟢 Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: '24'

      - name: "🔍 Check required secrets are configured"
        id: preflight
        env:
          HAS_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL != '' }}
          HAS_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
          HAS_BACKUP_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY != '' }}
        run: |
          if [ "$HAS_REDIS_URL" = "true" ] && [ "$HAS_REDIS_TOKEN" = "true" ] && [ "$HAS_BACKUP_KEY" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Customer data backup skipped — required backup secrets are not fully configured."
          fi

      - name: "💾 Run backup"
        if: steps.preflight.outputs.ready == 'true'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          BACKUP_ENCRYPTION_KEY: ${{ secrets.BACKUP_ENCRYPTION_KEY }}
        run: node scripts/backup-customer-data.js backups/customer-data.enc

      - name: "📤 Upload encrypted snapshot as artifact"
        if: steps.preflight.outputs.ready == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: customer-data-backup-${{ github.run_id }}
          path: backups/customer-data.enc
          if-no-files-found: error
          retention-days: 7
