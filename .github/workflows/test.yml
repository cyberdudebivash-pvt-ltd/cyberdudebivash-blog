name: Sentinel APEX Test Suite

on:
  push:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - 'package.json'
      - '.github/workflows/test.yml'
  pull_request:
    branches: [main, develop]
    paths:
      - 'lib/**'
      - 'tests/**'
      - 'jest.config.js'
      - 'jest.setup.ts'
      - 'package.json'

concurrency:
  group: test-${{ github.ref }}
  cancel-in-progress: false

jobs:
  test:
    name: Jest Test Suite
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          echo "📦 Installing dependencies with fallback strategy..."
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            if npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log; then
              echo "✅ Dependencies installed successfully (via fallback)"
            else
              echo "❌ Both npm ci and npm install failed"
              echo "Installation log:"
              tail -30 /tmp/npm-install.log
              exit 1
            fi
          fi

      - name: Check TypeScript compilation
        run: npx tsc --noEmit

      - name: Run all tests
        run: npm run test:ci
        env:
          NODE_ENV: test

      - name: Upload coverage reports
        uses: codecov/codecov-action@v3
        with:
          files: ./coverage/coverage-final.json
          flags: unittests
          name: codecov-umbrella
          fail_ci_if_error: false

      - name: Archive test results
        if: always()
        uses: actions/upload-artifact@v3
        with:
          name: test-results-node20
          path: coverage/
          retention-days: 30

  test-e2e:
    name: End-to-End Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Run E2E tests
        run: npm run test:e2e
        env:
          NODE_ENV: test

  test-governance:
    name: Governance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Run governance tests
        run: npm run test:governance
        env:
          NODE_ENV: test

  test-performance:
    name: Performance Tests
    runs-on: ubuntu-latest
    timeout-minutes: 45
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Run performance tests
        run: npm run test:performance
        env:
          NODE_ENV: test

  test-resilience:
    name: Resilience Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Run resilience tests
        run: npm run test:resilience
        env:
          NODE_ENV: test

  coverage-check:
    name: Coverage Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15
    needs: test

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Generate coverage report
        run: npm run test:coverage
        env:
          NODE_ENV: test

      - name: Check coverage thresholds
        run: |
          npx nyc check-coverage --lines 80 --functions 80 --branches 70 || true

      - name: Comment coverage on PR
        if: github.event_name == 'pull_request'
        uses: romeovs/lcov-reporter-action@v0.3.1
        with:
          lcov-file: ./coverage/lcov.info
          github-token: ${{ secrets.GITHUB_TOKEN }}

  build-check:
    name: Build Verification
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: |
          if npm ci --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            npm install --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log || exit 1
          fi

      - name: Build validation
        run: npm run fetch-intel --dry-run || true

      - name: Dependency audit
        run: npm audit --production || true
