name: "⚡ SENTINEL APEX — Global Intel Pipeline v4.0"
on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:
    inputs:
      force_reset_state:
        description: "Reset intel-state.json (re-publish all)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      debug:
        description: "Enable debug logging"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: sentinel-apex-pipeline
  cancel-in-progress: false

jobs:
  ingest-process-publish:
    name: "Ingest → Correlate → Score → Filter → Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Pre-flight: verify engine"
        run: |
          echo "⚡ SENTINEL APEX v4.0 — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "9 Phases: IOC Enrichment + Correlation + Priority Scoring + Signal Filtering + API Platform + Paid Tiers + Advanced Reports + Performance + Validation"
          node --version
          test -f fetch-live-intel.js || (echo "❌ fetch-live-intel.js missing" && exit 1)
          echo "✅ Engine verified"

      - name: "Initialize intel-state.json"
        run: |
          if [ "${{ github.event.inputs.force_reset_state }}" = "true" ]; then
            echo '{"published":[],"lastRun":null,"totalPublished":0,"correlations":{},"version":"4.0","platform":"CYBERDUDEBIVASH SENTINEL APEX v4.0","note":"Manual reset via workflow_dispatch."}' > intel-state.json
            echo "⚠️ State RESET by operator"
          elif [ ! -f intel-state.json ]; then
            echo '{"published":[],"lastRun":null,"totalPublished":0,"correlations":{},"version":"4.0","platform":"CYBERDUDEBIVASH SENTINEL APEX v4.0"}' > intel-state.json
            echo "✅ State initialized fresh"
          else
            echo "✅ State loaded ($(node -e "const s=require('./intel-state.json');console.log(s.published.length+' published, total='+s.totalPublished)"  2>/dev/null || echo 'existing'))"
          fi

      - name: "Run SENTINEL APEX v4.0 Pipeline"
        timeout-minutes: 6
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: |
          timeout 360 node fetch-live-intel.js
          echo "✅ Pipeline completed successfully"

      - name: "Detect changes"
        id: changes
        run: |
          git config user.name  "SENTINEL-APEX[bot]"
          git config user.email "sentinel-apex@cyberdudebivash.com"
          CHANGED=$(git status --short | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "📊 Changed files: $CHANGED"
          git status --short | head -20

      - name: "Commit and push intel"
        if: steps.changes.outputs.changed != '0'
        run: |
          git add -A
          NEW_POSTS=$(git status --cached --short | grep "^A.*posts/" | wc -l | tr -d ' ')
          API_FILES=$(git status --cached --short | grep "^A.*api/" | wc -l | tr -d ' ')
          TOTAL_PUB=$(node -e "try{const s=require('./intel-state.json');console.log(s.totalPublished||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
          COMMIT_MSG="SENTINEL APEX v4.0: +${NEW_POSTS} reports, +${API_FILES} API files, total=${TOTAL_PUB} [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [skip ci]"
          git commit -m "$COMMIT_MSG"
          # Push with retry + rebase
          for i in 1 2 3; do
            git push origin main && echo "✅ Push succeeded" && break
            if [ $i -lt 3 ]; then
              echo "⚠️ Push attempt $i failed — retrying with rebase..."
              git pull --rebase origin main
              sleep $((i * 3))
            else
              echo "❌ Push failed after 3 attempts" && exit 1
            fi
          done

      - name: "Run summary"
        if: always()
        run: |
          echo "══════════════════════════════════════════════"
          echo "⚡ SENTINEL APEX v4.0 — RUN SUMMARY"
          echo "══════════════════════════════════════════════"
          echo "Timestamp  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger    : ${{ github.event_name }}"
          echo "Runner     : ${{ runner.os }}"
          if [ -f intel-state.json ]; then
            node -e "
              const s=require('./intel-state.json');
              console.log('Published  : '+s.totalPublished);
              console.log('Last run   : '+s.lastRun);
              console.log('Version    : '+(s.version||'4.0'));
            " 2>/dev/null || true
          fi
          if [ -f live-intel.json ]; then
            node -e "
              const d=require('./live-intel.json');
              const st=d.stats||{};
              console.log('Live items : '+d.items.length);
              console.log('CRITICAL   : '+(st.critical||0));
              console.log('CISA KEV   : '+(st.cisaKev||0));
              console.log('Exploited  : '+(st.exploited||0));
            " 2>/dev/null || true
          fi
          echo "══════════════════════════════════════════════"

      - name: "Alert on failure"
        if: failure()
        run: |
          echo "::error title=SENTINEL APEX v4.0 Pipeline Failed::Pipeline run failed at $(date -u). Check logs above for root cause. Sources may be rate-limiting or offline."
