name: "⚡ SENTINEL APEX v5.0 — High-Frequency Global Intel Pipeline"
on:
  schedule:
    # Runs at :00 and :30. Interleaved with blogger-syndication (:15/:45) so
    # pushes to main land every ~15 min — longer than the Vercel build time,
    # which prevents deploy starvation (rapid pushes canceling in-flight
    # deploys so nothing ever publishes). Intel still refreshes every 30 min.
    - cron: "0,30 * * * *"
  workflow_dispatch:
    inputs:
      force_reset_state:
        description: "Reset intel-state.json (re-publish all)"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]
      debug:
        description: "Enable debug logging"
        required: false
        default: "false"
        type: choice
        options: ["false", "true"]

permissions:
  contents: write

concurrency:
  group: main-content-writers
  cancel-in-progress: false

jobs:
  ingest-process-publish:
    name: "28 Sources → Tiered Parallel → Stream → Publish"
    runs-on: ubuntu-latest
    timeout-minutes: 7

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Pre-flight: verify engine"
        run: |
          echo "⚡ SENTINEL APEX v5.0 — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "28 Sources | Tiered Parallel | Stream-Like | Lock Mechanism | Health Mon."
          node --version

          # ── CRITICAL: File existence checks ──────────────────────────────
          test -f fetch-live-intel.js || (echo "❌ FATAL: fetch-live-intel.js missing" && exit 1)

          # ── CRITICAL: Node.js syntax validation (fail-fast gate) ─────────
          echo "🔍 Syntax-checking fetch-live-intel.js..."
          if ! node --check fetch-live-intel.js 2>&1; then
            echo "❌ FATAL: fetch-live-intel.js has a syntax error — aborting pipeline"
            echo "::error title=Engine Syntax Error::fetch-live-intel.js failed node --check. File may be truncated or corrupted. Restore from last good commit."
            exit 1
          fi
          FILE_LINES=$(wc -l < fetch-live-intel.js)
          FILE_BYTES=$(wc -c < fetch-live-intel.js)
          echo "✅ Syntax OK — ${FILE_LINES} lines, ${FILE_BYTES} bytes"

          # ── Minimum size guard (< 1000 lines = definitely truncated) ─────
          if [ "$FILE_LINES" -lt 1000 ]; then
            echo "❌ FATAL: fetch-live-intel.js is suspiciously small (${FILE_LINES} lines)"
            exit 1
          fi

          # ── Stale lock cleanup ────────────────────────────────────────────
          if [ -f pipeline.lock ]; then
            LOCK_AGE=$(( $(date +%s) - $(stat -c %Y pipeline.lock 2>/dev/null || echo 0) ))
            if [ "$LOCK_AGE" -gt 480 ]; then
              echo "⚠️ Removing stale lock (age: ${LOCK_AGE}s)"
              rm -f pipeline.lock
            else
              echo "ℹ️ Lock file present (age: ${LOCK_AGE}s) — pipeline self-manages"
            fi
          fi
          echo "✅ Engine verified — ready to run"

      - name: "Initialize intel-state.json"
        run: |
          if [ "${{ github.event.inputs.force_reset_state }}" = "true" ]; then
            echo '{"published":[],"lastRun":null,"totalPublished":0,"correlations":{},"sourceFetchState":{},"sourceHealth":{},"version":"5.0","platform":"CYBERDUDEBIVASH SENTINEL APEX v5.0","note":"Manual reset via workflow_dispatch."}' > intel-state.json
            echo "⚠️ State RESET by operator"
          elif [ ! -f intel-state.json ]; then
            echo '{"published":[],"lastRun":null,"totalPublished":0,"correlations":{},"sourceFetchState":{},"sourceHealth":{},"version":"5.0","platform":"CYBERDUDEBIVASH SENTINEL APEX v5.0"}' > intel-state.json
            echo "✅ State initialized fresh"
          else
            echo "✅ State loaded: $(node -e "
              const s=require('./intel-state.json');
              const h=s.sourceHealth||{};
              const deg=Object.values(h).filter(x=>x.status==='degraded').map(x=>x.name);
              console.log(s.published.length+' in dedup, total='+s.totalPublished+(deg.length?' | DEGRADED: '+deg.join(','):''));
            " 2>/dev/null || echo 'existing')"
          fi

      - name: "Run SENTINEL APEX v5.0 Pipeline"
        timeout-minutes: 5
        env:
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          OTX_API_KEY: ${{ secrets.OTX_API_KEY }}
          SENTINEL_APEX_API_KEY: ${{ secrets.SENTINEL_APEX_API_KEY }}
          DEBUG: ${{ github.event.inputs.debug }}
        run: |
          echo "🚀 Starting SENTINEL APEX v5.0 pipeline at $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          timeout 290 node fetch-live-intel.js
          EXIT_CODE=$?
          rm -f pipeline.lock 2>/dev/null || true
          if [ $EXIT_CODE -eq 0 ]; then
            echo "✅ Pipeline completed successfully (exit 0)"
          elif [ $EXIT_CODE -eq 143 ] || [ $EXIT_CODE -eq 124 ]; then
            echo "⚠️ Pipeline timed out after 290s — partial results written atomically (safeWriteSync active)"
            echo "ℹ️ Timeout exit is non-fatal — continuing to detect changes and commit"
          else
            echo "::error title=Pipeline Runtime Error::Pipeline exited with code ${EXIT_CODE}. Check Node.js output above for root cause."
            rm -f pipeline.lock 2>/dev/null || true
            exit $EXIT_CODE
          fi

      - name: "Ensure feed heartbeat (production stability)"
        run: |
          echo "⏱️ Adding heartbeat timestamp to live-intel.json..."
          node -e "
            const fs = require('fs');
            try {
              const data = JSON.parse(fs.readFileSync('live-intel.json', 'utf8'));
              const now = new Date().toISOString();

              // Update metadata with current timestamp (heartbeat)
              if (!data.metadata) data.metadata = {};
              data.metadata.generatedAt = now;
              data.metadata.lastPipelineRun = now;
              data._heartbeat = now;

              // Ensure all items have _addedAt for freshness calculation
              if (data.items && Array.isArray(data.items)) {
                data.items.forEach((item, idx) => {
                  if (!item._addedAt) {
                    item._addedAt = item.pubDate || item.published || now;
                  }
                });
              }

              fs.writeFileSync('live-intel.json', JSON.stringify(data, null, 2));
              console.log('✅ Heartbeat added to ' + (data.items?.length || 0) + ' items');
            } catch(e) {
              console.error('⚠️ Heartbeat update failed: ' + e.message);
              // Non-fatal - continue to commit attempt
            }
          " 2>&1

      - name: "Detect changes"
        id: changes
        run: |
          git config user.name  "SENTINEL-APEX[bot]"
          git config user.email "sentinel-apex@cyberdudebivash.com"
          # Remove lock file from git tracking (should never be committed)
          rm -f pipeline.lock
          CHANGED=$(git status --short | grep -v "pipeline.lock" | wc -l | tr -d ' ')
          echo "changed=$CHANGED" >> $GITHUB_OUTPUT
          echo "📊 Changed files: $CHANGED"
          git status --short | grep -v "pipeline.lock" | head -20

      - name: "Commit and push intel (always commit for heartbeat)"
        run: |
          git add live-intel.json intel-state.json 2>/dev/null || true
          git add -A
          git reset HEAD pipeline.lock 2>/dev/null || true

          # Check if there are changes (including heartbeat)
          CHANGED=$(git status --cached --short | grep -v "pipeline.lock" | wc -l | tr -d ' ')

          if [ "$CHANGED" = "0" ]; then
            echo "ℹ️ No changes detected — skipping commit (feed already up-to-date)"
            exit 0
          fi

          echo "📝 Preparing commit for $CHANGED changed file(s)..."
          NEW_POSTS=$(git status --cached --short | grep "^A.*posts/" | wc -l | tr -d ' ')
          API_FILES=$(git status --cached --short | grep "^A.*api/" | wc -l | tr -d ' ')
          MOD_FILES=$(git status --cached --short | grep "^M" | wc -l | tr -d ' ')
          TOTAL_PUB=$(node -e "try{const s=require('./intel-state.json');console.log(s.totalPublished||0)}catch(e){console.log(0)}" 2>/dev/null || echo 0)
          SOURCES=$(node -e "try{const d=require('./live-intel.json');const u=[...new Set(d.items.map(i=>i.source))];console.log(u.length+'srcs')}catch(e){console.log('?srcs')}" 2>/dev/null || echo '?srcs')

          COMMIT_MSG="SENTINEL APEX v5.0: +${NEW_POSTS} reports, +${API_FILES} API files, ~${MOD_FILES} modified, total=${TOTAL_PUB}, ${SOURCES} [$(date -u '+%Y-%m-%dT%H:%M:%SZ')] [skip ci]"
          git commit -m "$COMMIT_MSG"

          echo "🚀 Pushing to main with retry logic..."
          # Push with retry + rebase (production-stable)
          for i in 1 2 3; do
            if git push origin main; then
              echo "✅ Push succeeded (attempt $i)"
              break
            fi
            if [ $i -lt 3 ]; then
              echo "⚠️ Push attempt $i failed — rebasing and retrying..."
              sleep $((i * 3))
              if git pull --rebase origin main 2>/dev/null; then
                echo "✅ Rebase succeeded"
              else
                echo "⚠️ Rebase failed — aborting and retrying"
                git rebase --abort 2>/dev/null || true
              fi
            else
              echo "❌ Push failed after 3 attempts"
              exit 1
            fi
          done

      - name: "Run summary"
        if: always()
        run: |
          echo "══════════════════════════════════════════════════════"
          echo "⚡ SENTINEL APEX v5.0 — RUN SUMMARY"
          echo "══════════════════════════════════════════════════════"
          echo "Timestamp  : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger    : ${{ github.event_name }}"
          echo "Runner     : ${{ runner.os }}"
          if [ -f intel-state.json ]; then
            node -e "
              const s=require('./intel-state.json');
              console.log('Published  : '+s.totalPublished);
              console.log('Last run   : '+s.lastRun);
              console.log('Version    : '+(s.version||'5.0'));
              const h=s.sourceHealth||{};
              const ok=Object.values(h).filter(x=>x.status==='ok').length;
              const deg=Object.values(h).filter(x=>x.status==='degraded').length;
              const warn=Object.values(h).filter(x=>x.status==='warning').length;
              console.log('Src Health : '+ok+' ok, '+warn+' warn, '+deg+' degraded');
            " 2>/dev/null || true
          fi
          if [ -f live-intel.json ]; then
            node -e "
              const d=require('./live-intel.json');
              const st=d.stats||{};
              const srcs=[...new Set(d.items.map(i=>i.source))];
              console.log('Live items : '+d.items.length);
              console.log('CRITICAL   : '+(st.critical||0));
              console.log('CISA KEV   : '+(st.cisaKev||0));
              console.log('Exploited  : '+(st.exploited||0));
              console.log('Sources    : '+srcs.length+' ('+srcs.slice(0,8).join(', ')+(srcs.length>8?'...':'')+')');
            " 2>/dev/null || true
          fi
          echo "══════════════════════════════════════════════════════"

      - name: "Alert on failure"
        if: failure()
        run: |
          echo "::error title=SENTINEL APEX v5.0 Pipeline Failed::Pipeline failed at $(date -u). Check logs. Sources may be rate-limiting or offline. Lock file cleaned automatically."
          rm -f pipeline.lock
