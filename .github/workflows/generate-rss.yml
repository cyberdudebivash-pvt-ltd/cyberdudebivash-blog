name: "🛰 SENTINEL APEX — Auto RSS Generator"

on:
  push:
    branches: [main]
    paths:
      - 'posts/**'
      - 'generate-rss.js'
  schedule:
    - cron: '0 */6 * * *'   # Regenerate every 6 hours
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: main-content-writers
  cancel-in-progress: false

jobs:
  generate-rss:
    name: "Generate & Validate RSS Feed"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "🛰 Generate RSS feed"
        run: |
          echo "🛰 Generating RSS feed — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          node generate-rss.js
          echo "✅ generate-rss.js completed"

      - name: "✅ Validate RSS XML"
        run: |
          if [ ! -f "rss.xml" ]; then
            echo "::error title=RSS Generation Failed::rss.xml was not generated"
            exit 1
          fi

          size=$(wc -c < rss.xml)
          if [ "$size" -lt 500 ]; then
            echo "::error title=RSS Too Small::rss.xml is only ${size} bytes — generation may have failed"
            exit 1
          fi

          if ! grep -q '<rss version="2.0"' rss.xml; then
            echo "::error title=RSS Invalid::rss.xml missing <rss version=\"2.0\"> declaration"
            exit 1
          fi

          if ! grep -q '<item>' rss.xml; then
            echo "::error title=RSS No Items::rss.xml has no <item> elements"
            exit 1
          fi

          item_count=$(grep -c '<item>' rss.xml)
          echo "✅ rss.xml validated: ${size} bytes, ${item_count} items"
          echo "📡 Feed: https://blog.cyberdudebivash.in/rss.xml"

      - name: "🔍 Check for changes"
        id: check_changes
        run: |
          if git diff --quiet rss.xml 2>/dev/null; then
            echo "changed=false" >> $GITHUB_OUTPUT
            echo "ℹ️ rss.xml unchanged — no commit needed"
          else
            echo "changed=true" >> $GITHUB_OUTPUT
            echo "📝 rss.xml has changes — will commit"
          fi

      - name: "📦 Commit and push rss.xml"
        if: steps.check_changes.outputs.changed == 'true'
        run: |
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"
          git add rss.xml
          git commit -m "🛰 [SENTINEL APEX] Auto-update rss.xml — $(date -u '+%Y-%m-%d %H:%M UTC') [skip ci]"

          # Push with retry + rebase on conflict
          for i in 1 2 3; do
            git push origin main && echo "✅ Push succeeded (attempt $i)" && break
            if [ $i -lt 3 ]; then
              echo "⚠️ Push attempt $i failed — rebasing..."
              git pull --rebase origin main || { echo "⚠️ Rebase conflict — aborting cleanly, will retry"; git rebase --abort 2>/dev/null || true; }
              sleep $((i * 3))
            else
              echo "::error title=RSS Push Failed::Failed to push rss.xml after 3 attempts"
              exit 1
            fi
          done

      - name: "📋 Run summary"
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "🛰 SENTINEL APEX RSS Generator Done"
          echo "Timestamp : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger   : ${{ github.event_name }}"
          if [ -f rss.xml ]; then
            echo "RSS size  : $(wc -c < rss.xml) bytes"
            echo "RSS items : $(grep -c '<item>' rss.xml || echo 0)"
          fi
          echo "════════════════════════════════════"
