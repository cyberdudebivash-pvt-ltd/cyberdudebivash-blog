name: "🔒 SENTINEL APEX — Security Audit & Dependency Check"

on:
  push:
    branches: [main]
    paths:
      - 'package.json'
      - 'package-lock.json'
      - 'api/**'
      - 'fetch-live-intel.js'
      - 'generate-rss.js'
  schedule:
    - cron: '0 6 * * 1'   # Every Monday at 06:00 UTC
  workflow_dispatch:

jobs:
  security-audit:
    name: "npm audit + Security Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: "📥 Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "⚙️ Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: "🔒 npm audit — Critical vulnerabilities only"
        run: |
          echo "🔒 SENTINEL APEX Security Audit — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          if [ ! -f "package.json" ]; then
            echo "ℹ️  No package.json found — static site, skipping npm audit"
            exit 0
          fi

          npm install --ignore-scripts --no-fund --legacy-peer-deps 2>&1 | grep -v "deprecated" | tail -5
          echo ""
          echo "=== npm audit (critical only) ==="
          npm audit --audit-level=critical --json 2>/dev/null | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin','utf8'));
            const vulns = d.vulnerabilities || {};
            const critical = Object.values(vulns).filter(v => v.severity === 'critical');

            if (critical.length > 0) {
              console.error('❌ FAIL: ' + critical.length + ' CRITICAL vulnerabilities found:');
              critical.forEach(v => {
                console.error('  - ' + v.name + ' [CRITICAL]');
                console.error('    Fix: ' + (v.fixAvailable ? 'Available' : 'No fix available'));
              });
              process.exit(1);
            } else {
              console.log('✅ No CRITICAL vulnerabilities found');
              const high = Object.values(vulns).filter(v => v.severity === 'high');
              const moderate = Object.values(vulns).filter(v => v.severity === 'moderate');
              const low = Object.values(vulns).filter(v => v.severity === 'low');
              if (high.length > 0) console.log('⚠️  ' + high.length + ' high-severity (in dev deps, monitoring)');
              if (moderate.length > 0) console.log('ℹ️  ' + moderate.length + ' moderate-severity (acceptable in dev)');
              if (low.length > 0) console.log('ℹ️  ' + low.length + ' low-severity');
            }
          " || exit 1

      - name: "🔍 Secret Exposure Check"
        run: |
          echo "🔍 Checking for accidentally committed secrets..."

          # Check for common secret patterns in committed files (not .env files)
          PATTERNS=(
            "sk_live_"
            "sk_test_"
            "AKIA[A-Z0-9]{16}"
            "ghp_[A-Za-z0-9]{36}"
            "xoxb-[0-9]{11}"
          )

          FOUND=0
          for pattern in "${PATTERNS[@]}"; do
            if git grep -rE "$pattern" -- '*.js' '*.html' '*.json' '*.yml' '*.yaml' 2>/dev/null | grep -v "node_modules" | grep -v ".git" | grep -v "# example" | head -5; then
              echo "::warning title=Potential Secret Exposure::Pattern '$pattern' found in tracked files. Review above matches."
              FOUND=1
            fi
          done

          if [ "$FOUND" -eq 0 ]; then
            echo "✅ No secret patterns detected in tracked files"
          fi

      - name: "🔐 Security Headers Validation"
        run: |
          echo "🔐 Validating vercel.json security headers..."

          if [ ! -f "vercel.json" ]; then
            echo "⚠️  vercel.json not found — cannot validate headers"
            exit 0
          fi

          node -e "
            const v = require('./vercel.json');
            const headers = v.headers || [];
            const required = ['Strict-Transport-Security','X-Frame-Options','X-Content-Type-Options','Referrer-Policy'];
            const allHeaders = headers.flatMap(h => (h.headers||[]).map(x => x.key));
            const missing = required.filter(r => !allHeaders.includes(r));
            if (missing.length > 0) {
              console.warn('⚠️  Missing security headers: ' + missing.join(', '));
            } else {
              console.log('✅ All required security headers present: ' + required.join(', '));
            }
            const hasHSTS = allHeaders.includes('Strict-Transport-Security');
            console.log('HSTS:             ' + (hasHSTS ? '✅' : '❌'));
            console.log('X-Frame-Options:  ' + (allHeaders.includes('X-Frame-Options') ? '✅' : '❌'));
            console.log('CSP present:      ' + (allHeaders.includes('Content-Security-Policy') ? '✅' : '❌'));
          "

      - name: "📋 Audit Summary"
        if: always()
        run: |
          echo "════════════════════════════════════"
          echo "🔒 SENTINEL APEX Security Audit Done"
          echo "Timestamp : $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          echo "Trigger   : ${{ github.event_name }}"
          echo "════════════════════════════════════"
