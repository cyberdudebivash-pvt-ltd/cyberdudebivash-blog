name: "⚡ CYBERDUDEBIVASH® — Blogger Syndication Engine"

on:
  # RX-STABILIZATION-1 — automatic publication restored 2026-08-12T18:1x UTC.
  schedule:
    # Runs every 2 hours at :47 (was :15; 00:47, 02:47, … 22:47) = 12 runs/day.
    # This workflow's commit message ("syndication: premium-published...")
    # does not match vercel-ignore-build.sh's bot-throttle patterns, so it is
    # not subject to the Vercel deploy-window constraint — the minute here
    # only needs to avoid colliding with the other 8 cron schedules in this
    # repo. A repo-wide GitHub Actions scheduled-trigger stall on 2026-09-03
    # (root cause: 6+ workflows clustered on :00/:15/:30/:40, which GitHub's
    # own docs identify as high-load, delay-prone times) meant zero intel
    # reports published that day; every scheduled workflow here now uses a
    # distinct minute offset. See sentinel-apex.yml for the full incident note.
    - cron: "47 */2 * * *"
  # Production deployment runs immediately after the dedicated evidence gate
  # passes on main. State/log-only publication commits do not retrigger that
  # gate, so this cannot create a workflow loop.
  workflow_run:
    workflows: ["Blogger Evidence Integrity CI"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run (validate without publishing)"
        required: false
        default: "false"
        type: choice
        options:
          - "false"
          - "true"
      max_posts:
        description: "Max posts per run (default: 5; Blogger quota-safe)"
        required: false
        default: "5"

concurrency:
  group: main-content-writers
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  syndicate:
    name: "📡 Syndicate Premium Reports to Blogger"
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    # Premium long-form generation uses a larger output budget and performs
    # bounded Blogger fetch-back/repair verification before success.
    timeout-minutes: 20

    steps:
      - name: "📥 Checkout Repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: "🐍 Set Up Python 3.11"
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: "📦 Install Dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-timeout

      - name: "✅ Validate Premium Publication Modules"
        run: |
          python -c "
          from automation.config import Config
          from automation.content_discovery import ContentDiscoveryEngine
          from automation.authority_transformer import AuthorityTransformer
          from automation.blogger_publisher import BloggerPublisher
          from automation.premium_publication import PremiumAuthorityTransformer, VerifiedBloggerPublisher, assess_enterprise_report, assess_live_artifact
          from automation.premium_main import main as premium_main
          from automation.seo_optimizer import SEOOptimizer
          from automation.social_amplifier import SocialAmplifier
          from automation.rss_aggregator import GlobalRSSAggregator
          from automation.threat_feeds import CISAAdvisoriesSource, RansomwareIntelSource, DataBreachIntelSource, ThreatActorIntelSource
          print('Premium publication modules imported successfully')
          "

      - name: "🧪 Run Unit & Integration Tests"
        run: |
          python -m pytest tests/ automation/tests/ \
            --tb=short \
            --timeout=30 \
            -q
        continue-on-error: false

      - name: "🔧 Configure Git"
        run: |
          git config user.name "CYBERDUDEBIVASH"
          git config user.email "bivash@cyberdudebivash.com"

      - name: "⚡ Run Premium Syndication Pipeline"
        env:
          BLOGGER_CLIENT_ID: ${{ secrets.BLOGGER_CLIENT_ID }}
          BLOGGER_CLIENT_SECRET: ${{ secrets.BLOGGER_CLIENT_SECRET }}
          BLOGGER_REFRESH_TOKEN: ${{ secrets.BLOGGER_REFRESH_TOKEN }}
          BLOGGER_BLOG_ID: ${{ secrets.BLOGGER_BLOG_ID }}
          NVD_API_KEY: ${{ secrets.NVD_API_KEY }}
          ALIENVAULT_OTX_KEY: ${{ secrets.ALIENVAULT_OTX_KEY }}
          GOOGLE_SEARCH_CONSOLE_KEY: ${{ secrets.GOOGLE_SEARCH_CONSOLE_KEY }}
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
          NEWSLETTER_SIGNUP_URL: ${{ secrets.NEWSLETTER_SIGNUP_URL }}
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          DEEPSEEK_API_KEY: ${{ secrets.DEEPSEEK_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          MAX_POSTS_PER_RUN: ${{ github.event.inputs.max_posts || '5' }}
        run: |
          DRY_RUN_FLAG=""
          if [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            DRY_RUN_FLAG="--dry-run"
            echo "Running in DRY RUN mode — no posts will be published"
          fi

          set +e
          python -m automation.premium_main \
            $DRY_RUN_FLAG \
            --max-posts ${{ github.event.inputs.max_posts || '5' }} \
            2>&1 | tee logs/pipeline-output.txt
          PIPELINE_EXIT=${PIPESTATUS[0]}

          RUN_STATUS=$(python -c "
          import json, glob
          try:
              latest = sorted(glob.glob('logs/run-*.json'))[-1]
              with open(latest) as f:
                  print(json.load(f).get('run_status', 'UNKNOWN'))
          except Exception:
              print('UNKNOWN')
          " 2>/dev/null || echo "UNKNOWN")
          echo "Pipeline run_status: ${RUN_STATUS}"

          if [ "$PIPELINE_EXIT" -ne 0 ]; then
            echo "::error::Premium syndication pipeline exited with code ${PIPELINE_EXIT} (run_status=${RUN_STATUS})."
          elif [ "$RUN_STATUS" = "DEGRADED" ]; then
            echo "::warning::Premium syndication completed DEGRADED — reports below the premium public quality floor, evidence integrity gate, Blogger artifact verification, or provider availability requirements were held/requeued rather than published thin or corrupted."
          fi
          exit $PIPELINE_EXIT

      - name: "💾 Commit Publication State"
        if: always()
        run: |
          git add data/published_posts.json || true
          git add logs/*.json || true

          if git diff --cached --quiet; then
            echo "No state changes to commit"
            exit 0
          fi

          PUBLISHED=$(python -c "
          import json
          try:
            with open('data/published_posts.json') as f:
              d = json.load(f)
            print(d.get('total_published', 0))
          except:
            print(0)
          ")

          git commit -m "syndication: premium-published [${PUBLISHED} total posts] — $(date -u '+%Y-%m-%d %H:%M UTC')"

          for attempt in 1 2 3; do
            git pull --rebase origin ${{ github.ref_name }} --quiet 2>/dev/null || true
            if git push origin ${{ github.ref_name }}; then
              echo "Push succeeded on attempt ${attempt}"
              break
            fi
            if [ $attempt -lt 3 ]; then
              echo "Push failed, retrying in $((attempt * 3))s..."
              sleep $((attempt * 3))
            else
              echo "Push failed after 3 attempts — state will sync next run"
              exit 0
            fi
          done

      - name: "📊 Pipeline Summary"
        if: always()
        run: |
          echo "=== CYBERDUDEBIVASH® Premium Blogger Syndication Summary ==="
          echo "Run timestamp: $(date -u '+%Y-%m-%d %H:%M:%S UTC')"

          LATEST_REPORT=$(ls -t logs/run-*.json 2>/dev/null | head -1)
          if [ -n "$LATEST_REPORT" ]; then
            echo "Run report: $LATEST_REPORT"
            python -c "
          import json
          try:
            with open('$LATEST_REPORT') as f:
              r = json.load(f)
            print(f'Run status: {r.get(\"run_status\", \"UNKNOWN\")}')
            print(f'Discovered: {r.get(\"discovered\", 0)}')
            print(f'Published:  {r.get(\"published\", 0)}')
            print(f'Failed:     {r.get(\"failed\", 0)}')
            print(f'Integrity blocked: {r.get(\"integrity_blocked\", 0)}')
            print(f'Fetch-back discrepancies: {r.get(\"fetch_back_discrepancies\", 0)}')
            print(f'Dry run:    {r.get(\"dry_run\", False)}')
            if r.get('errors'):
              print(f'Errors: {r[\"errors\"]}')
          except Exception as e:
            print(f'Could not parse report: {e}')
            "
          else
            echo "No run report found"
          fi

          TOTAL=$(python -c "
          import json
          try:
            with open('data/published_posts.json') as f:
              d = json.load(f)
            print(d.get('total_published', 0))
          except:
            print(0)
          " 2>/dev/null || echo "0")
          echo "Total syndicated posts (all time): ${TOTAL}"
          echo "Public CTI: https://cti.cyberdudebivash.in"
          echo "Source: https://blog.cyberdudebivash.in"

      - name: "🚨 Flag Pipeline Failure"
        if: failure()
        run: |
          echo "::error::CYBERDUDEBIVASH® Premium Blogger Syndication Pipeline FAILED"
          echo "::error::Check logs above for diagnosis"
          echo "::error::Contact: bivash@cyberdudebivash.com"
