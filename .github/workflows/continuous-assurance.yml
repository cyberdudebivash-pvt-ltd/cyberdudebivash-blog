name: "🛡️ SENTINEL APEX — Continuous Assurance"

on:
  push:
    branches: [main]
    paths:
      - 'Sentinel-APEX/**'
      - 'tests-js/**'
      - 'fetch-live-intel.js'
      - 'scripts/assure.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/continuous-assurance.yml'
  pull_request:
    paths:
      - 'Sentinel-APEX/**'
      - 'tests-js/**'
      - 'fetch-live-intel.js'
      - 'scripts/assure.sh'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/continuous-assurance.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: continuous-assurance-${{ github.ref }}
  cancel-in-progress: true

jobs:
  assure:
    name: "Full Assurance Pass"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "🐍 Set up Python"
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'
          cache: 'pip'
          cache-dependency-path: requirements.txt

      - name: "🟢 Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: "📦 Install Python dependencies"
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest

      - name: "📦 Install Node dependencies"
        run: npm ci --ignore-scripts --no-audit --no-fund

      - name: "🔒 Production dependency critical-vulnerability gate"
        run: npm audit --omit=dev --audit-level=critical

      - name: "🛡️ Run scripts/assure.sh (all stages)"
        run: bash scripts/assure.sh
