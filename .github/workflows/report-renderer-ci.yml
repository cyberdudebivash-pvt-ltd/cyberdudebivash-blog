name: "📄 SENTINEL APEX — Report Renderer CI"

on:
  push:
    branches: [main]
    paths:
      - 'Sentinel-APEX/renderer/**'
      - 'Sentinel-APEX/reports/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/report-renderer-ci.yml'
  pull_request:
    paths:
      - 'Sentinel-APEX/renderer/**'
      - 'Sentinel-APEX/reports/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/report-renderer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-renderer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-renderer-tests:
    name: "Report Renderer — Real Report Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v5
        with:
          persist-credentials: false

      - name: "🟢 Set up Node"
        uses: actions/setup-node@v5
        with:
          node-version: '24'
          cache: 'npm'

      - name: "📦 Install locked dependencies"
        run: npm ci --ignore-scripts --no-audit --no-fund --legacy-peer-deps

      - name: "🔒 Production dependency critical-vulnerability gate"
        run: npm audit --omit=dev --audit-level=critical

      - name: "🔬 Syntax-check the renderer"
        run: node -c Sentinel-APEX/renderer/report-renderer.js

      - name: "🧪 Run renderer tests (validated against real SA-2026-0001 reports)"
        working-directory: Sentinel-APEX/renderer
        run: node --test
