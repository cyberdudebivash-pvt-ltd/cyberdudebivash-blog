name: "📄 SENTINEL APEX — Report Renderer CI"

on:
  push:
    branches: [main]
    paths:
      - 'Sentinel-APEX/renderer/**'
      - 'Sentinel-APEX/reports/**'
      - 'package.json'
      - '.github/workflows/report-renderer-ci.yml'
  pull_request:
    paths:
      - 'Sentinel-APEX/renderer/**'
      - 'Sentinel-APEX/reports/**'
      - 'package.json'
      - '.github/workflows/report-renderer-ci.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: report-renderer-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  node-renderer-tests:
    name: "Report Renderer — Real Report Validation"
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4

      - name: "🟢 Set up Node"
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: "📦 Install dependencies"
        run: |
          echo "📦 Installing dependencies with fallback strategy..."
          if npm ci --no-audit --no-fund --legacy-peer-deps 2>&1 | tee /tmp/npm-install.log; then
            echo "✅ Dependencies installed successfully"
          else
            echo "⚠️  npm ci failed, attempting npm install as fallback..."
            if npm install --no-audit --no-fund --legacy-peer-deps 2>&1 | tee -a /tmp/npm-install.log; then
              echo "✅ Dependencies installed successfully (via fallback)"
            else
              echo "❌ Both npm ci and npm install failed"
              echo "Installation log:"
              tail -30 /tmp/npm-install.log
              exit 1
            fi
          fi

      - name: "🔬 Syntax-check the renderer"
        run: node -c Sentinel-APEX/renderer/report-renderer.js

      - name: "🧪 Run renderer tests (validated against real SA-2026-0001 reports)"
        working-directory: Sentinel-APEX/renderer
        run: node --test
