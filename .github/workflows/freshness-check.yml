name: "⚡ SENTINEL APEX — Intel Feed Freshness Monitor"

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:

concurrency:
  group: blog-freshness-check
  cancel-in-progress: true

# contents:read for checkout; actions:write because the "Auto-recovery
# trigger" step below calls github.rest.actions.createWorkflowDispatch()
# to re-run sentinel-apex.yml on CRITICAL staleness -- traced from the
# step's actual API call, not assumed.
permissions:
  contents: read
  actions: write

jobs:
  freshness-check:
    name: "Verify SENTINEL APEX pipeline is operational"
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Setup Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "Check live-intel.json freshness"
        run: |
          echo "⚡ SENTINEL APEX — Freshness Check — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Verify live-intel.json exists in repository
          echo "🔗 Verifying live-intel.json in repository..."
          if [ ! -f "live-intel.json" ]; then
            echo "::error title=Feed File Missing::live-intel.json not found in repository"
            exit 1
          fi

          FILE_SIZE=$(wc -c < live-intel.json)
          echo "✅ Found live-intel.json — ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "::error title=Feed Too Small::live-intel.json is only ${FILE_SIZE} bytes — possible corruption"
            exit 1
          fi

          # ── Freshness check ───────────────────────────────────────────────
          # IMPORTANT: pubDate/published fields reflect CVE/article PUBLICATION dates,
          # NOT when the pipeline ran. We use _addedAt (pipeline ingestion timestamp)
          # or metadata.generated (set on each pipeline run) for true freshness.
          node -e "
            const raw = require('fs').readFileSync('./live-intel.json', 'utf8');
            let d;
            try { d = JSON.parse(raw); } catch(e) {
              console.error('::error title=Feed Parse Error::live-intel.json is invalid JSON: ' + e.message);
              process.exit(1);
            }

            const items = d.items || [];
            if (items.length < 10) {
              console.error('::error title=Feed Empty::Only ' + items.length + ' items in feed (expected 50+)');
              process.exit(1);
            }

            console.log('Items in feed  : ' + items.length);

            // PRIMARY: latest _addedAt — ACTUAL item ingestion time (most reliable)
            const withAddedAt = items.filter(i => i._addedAt);
            let latestIngestDate = null;
            let latestIngestId = null;
            if (withAddedAt.length > 0) {
              const sorted = [...withAddedAt].sort((a,b) => new Date(b._addedAt) - new Date(a._addedAt));
              latestIngestDate = new Date(sorted[0]._addedAt);
              latestIngestId = sorted[0].id;
            }

            // SECONDARY FALLBACK: metadata.generated only if NO items have _addedAt
            const metaGenerated = (d.metadata || {}).generated || d.lastUpdated || null;

            // Determine freshness reference — prefer actual item timestamps
            let freshnessDate = null;
            let freshnessSource = '';

            if (latestIngestDate) {
              freshnessDate = latestIngestDate;
              freshnessSource = 'latest _addedAt (' + latestIngestId + ')';
            } else if (metaGenerated) {
              freshnessDate = new Date(metaGenerated);
              freshnessSource = 'metadata.generated (fallback — no item timestamps)';
            } else {
              // No timestamps available at all
              console.error('::error title=Malformed Feed::No _addedAt or metadata.generated in feed. Pipeline may be corrupted.');
              process.exit(1);
            }

            const ageMinutes = Math.floor((Date.now() - freshnessDate.getTime()) / 60000);

            console.log('Items in feed  : ' + items.length);
            console.log('Freshness ref  : ' + freshnessSource);
            console.log('Timestamp      : ' + freshnessDate.toISOString());
            console.log('Age (minutes)  : ' + ageMinutes);

            // PRODUCTION STABLE THRESHOLDS (Enhanced with Auto-Recovery):
            // - Feed should refresh every 30 min (APEX pipeline runs :00/:30)
            // - WARN at 90 min (3+ missed runs, likely backlog/delays)
            // - CRITICAL at 180 min (6+ missed runs, definite pipeline failure)
            // - CRITICAL exits non-zero so recovery and alert steps actually run
            let statusLevel = 'HEALTHY';
            if (ageMinutes > 180) {
              console.warn('::warning title=Pipeline Down (CRITICAL - AUTO-RECOVERY)::Latest items ' + ageMinutes + ' minutes old — pipeline stalled. Auto-recovery will trigger.');
              statusLevel = 'CRITICAL';
            } else if (ageMinutes > 90) {
              console.warn('::warning title=Pipeline Degraded (WARN)::Latest items ' + ageMinutes + ' minutes old — ' + Math.floor(ageMinutes / 30) + ' missed runs detected. Monitor for recovery.');
              statusLevel = 'DEGRADED';
            } else {
              console.log('✅ Pipeline healthy — latest items ' + ageMinutes + ' minutes old');
              statusLevel = 'HEALTHY';
            }

            console.log('Status level: ' + statusLevel);
            if (statusLevel === 'CRITICAL') process.exit(2);
            process.exit(0);
          " 2>&1

          echo "✅ Freshness check complete"

      - name: "Auto-recovery trigger"
        if: failure()
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            // Auto-trigger sentinel-apex.yml recovery only on CRITICAL (exit code 2)
            console.log('Checking for CRITICAL freshness failure — triggering recovery workflow...');
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sentinel-apex.yml',
                ref: 'main',
                inputs: {
                  force_reset_state: 'false',
                  debug: 'true'
                }
              });
              // createWorkflowDispatch responds 204 No Content -- GitHub never
              // returns the created run's id synchronously, so run.data.id was
              // always undefined here and threw on every call, which this
              // catch block silently reported as "trigger failed" even when
              // the dispatch itself was accepted.
              console.log('✅ Recovery workflow dispatch accepted for sentinel-apex.yml');
            } catch(e) {
              console.warn('⚠️ Auto-recovery trigger failed: ' + e.message);
            }

      - name: "Alert on failure"
        if: failure()
        run: |
          echo "::error title=SENTINEL APEX Feed Alert::Intel feed stale — auto-recovery workflow triggered. Manual trigger: https://github.com/cyberdudebivash/cyberdudebivash-blog/actions/workflows/sentinel-apex.yml"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
