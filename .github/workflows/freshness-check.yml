name: "⚡ SENTINEL APEX — Intel Feed Freshness Monitor"

on:
  schedule:
    - cron: '*/30 * * * *'
  workflow_dispatch:

concurrency:
  group: blog-freshness-check
  cancel-in-progress: true

permissions:
  contents: read
  actions: write

jobs:
  freshness-check:
    name: "Verify SENTINEL APEX runtime and intel freshness"
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "Checkout repository"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "Setup Node.js 22"
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: "Classify runtime and content freshness"
        id: freshness
        shell: bash
        run: |
          echo "⚡ SENTINEL APEX — Freshness Check — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
          set +e
          node scripts/check-intel-freshness.js live-intel.json intel-state.json
          CHECK_EXIT=$?
          set -e

          if [ "$CHECK_EXIT" -eq 2 ]; then
            echo "recovery_required=true" >> "$GITHUB_OUTPUT"
          else
            echo "recovery_required=false" >> "$GITHUB_OUTPUT"
          fi
          echo "classifier_exit=${CHECK_EXIT}" >> "$GITHUB_OUTPUT"

          # Exit 2 is a proven runtime outage and intentionally makes this
          # check red after authorizing recovery. Exit 1 is monitor/feed
          # corruption and also red, but it must NOT trigger the generator.
          exit "$CHECK_EXIT"

      - name: "Auto-recovery trigger"
        if: always() && steps.freshness.outputs.recovery_required == 'true'
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            console.log('Proven runtime outage detected — dispatching sentinel-apex.yml recovery...');
            try {
              await github.rest.actions.createWorkflowDispatch({
                owner: context.repo.owner,
                repo: context.repo.repo,
                workflow_id: 'sentinel-apex.yml',
                ref: 'main',
                inputs: {
                  force_reset_state: 'false',
                  debug: 'true'
                }
              });
              console.log('✅ Recovery workflow dispatch accepted for sentinel-apex.yml');
            } catch (e) {
              core.setFailed('Recovery workflow dispatch failed: ' + e.message);
            }

      - name: "Alert on failed monitor"
        if: failure()
        shell: bash
        run: |
          if [ "${{ steps.freshness.outputs.recovery_required }}" = "true" ]; then
            echo "::error title=SENTINEL APEX Runtime Alert::Generator runtime exceeded the critical freshness threshold. Recovery dispatch was authorized."
          else
            echo "::error title=SENTINEL APEX Monitor Alert::Freshness monitoring/feed validation failed, but runtime outage was NOT proven. Automatic recovery was intentionally suppressed."
          fi
          echo "Classifier exit: ${{ steps.freshness.outputs.classifier_exit }}"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
