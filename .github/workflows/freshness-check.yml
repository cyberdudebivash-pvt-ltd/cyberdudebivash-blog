name: "⚡ SENTINEL APEX — Intel Feed Freshness Monitor"

on:
  schedule:
    - cron: '*/30 * * * *'   # Every 30 minutes
  workflow_dispatch:

jobs:
  freshness-check:
    name: "Verify SENTINEL APEX pipeline is operational"
    runs-on: ubuntu-latest
    timeout-minutes: 3

    steps:
      - name: "Check live-intel.json freshness"
        run: |
          echo "⚡ SENTINEL APEX — Freshness Check — $(date -u '+%Y-%m-%dT%H:%M:%SZ')"

          # Fetch live-intel.json from production with improved error handling
          echo "🔗 Fetching live-intel.json from production..."
          HTTP_STATUS=$(curl -s -o /tmp/live-intel.json -w "%{http_code}" \
            "https://blog.cyberdudebivash.in/live-intel.json" \
            --max-time 20 \
            --connect-timeout 10 \
            -H "Cache-Control: no-cache" \
            -H "User-Agent: SENTINEL-APEX-CI/1.0")

          if [ "$HTTP_STATUS" != "200" ]; then
            echo "❌ Feed fetch failed with HTTP ${HTTP_STATUS}"
            echo "Attempting fallback: HEAD request to verify endpoint availability..."
            HEAD_STATUS=$(curl -s -o /dev/null -w "%{http_code}" -I \
              "https://blog.cyberdudebivash.in/live-intel.json" \
              --max-time 10)

            if [ "$HEAD_STATUS" != "200" ]; then
              echo "::error title=Production Platform Unreachable::Cannot reach blog.cyberdudebivash.in (HTTP ${HEAD_STATUS}). Platform may be offline or DNS issue."
              exit 1
            else
              echo "::warning title=Feed Fetch Degraded::HEAD request succeeded but GET failed. Retrying..."
              sleep 5
              HTTP_STATUS=$(curl -s -o /tmp/live-intel.json -w "%{http_code}" \
                "https://blog.cyberdudebivash.in/live-intel.json" \
                --max-time 20)
              if [ "$HTTP_STATUS" != "200" ]; then
                echo "::error title=Feed Fetch Failed::live-intel.json returned HTTP ${HTTP_STATUS} on retry"
                exit 1
              fi
            fi
          fi

          FILE_SIZE=$(wc -c < /tmp/live-intel.json)
          echo "✅ Fetched live-intel.json — ${FILE_SIZE} bytes"

          if [ "$FILE_SIZE" -lt 10000 ]; then
            echo "::error title=Feed Too Small::live-intel.json is only ${FILE_SIZE} bytes — possible corruption"
            exit 1
          fi

          # ── Freshness check ───────────────────────────────────────────────
          # IMPORTANT: pubDate/published fields reflect CVE/article PUBLICATION dates,
          # NOT when the pipeline ran. We use _addedAt (pipeline ingestion timestamp)
          # or metadata.generated (set on each pipeline run) for true freshness.
          node -e "
            const raw = require('fs').readFileSync('/tmp/live-intel.json', 'utf8');
            let d;
            try { d = JSON.parse(raw); } catch(e) {
              console.error('::error title=Feed Parse Error::live-intel.json is invalid JSON: ' + e.message);
              process.exit(1);
            }

            const items = d.items || [];
            if (items.length < 10) {
              console.error('::error title=Feed Empty::Only ' + items.length + ' items in feed (expected 50+)');
              process.exit(1);
            }

            console.log('Items in feed  : ' + items.length);

            // PRIMARY: metadata.generated — written by pipeline on every run
            const metaGenerated = (d.metadata || {}).generated || d.lastUpdated || null;

            // SECONDARY: latest _addedAt — pipeline ingestion timestamp per item
            const withAddedAt = items.filter(i => i._addedAt);
            let latestIngestDate = null;
            let latestIngestId = null;
            if (withAddedAt.length > 0) {
              const sorted = [...withAddedAt].sort((a,b) => new Date(b._addedAt) - new Date(a._addedAt));
              latestIngestDate = new Date(sorted[0]._addedAt);
              latestIngestId = sorted[0].id;
            }

            // Determine freshness reference
            let freshnessDate = null;
            let freshnessSource = '';

            if (metaGenerated) {
              freshnessDate = new Date(metaGenerated);
              freshnessSource = 'metadata.generated';
            } else if (latestIngestDate) {
              freshnessDate = latestIngestDate;
              freshnessSource = '_addedAt (' + latestIngestId + ')';
            } else {
              // No pipeline timestamp available — feed has items but pipeline stamps are missing.
              // This is a WARNING, not a hard failure. pubDate is unreliable for freshness.
              console.log('⚠️  WARNING: No _addedAt or metadata.generated found in feed.');
              console.log('   Pipeline timestamps not yet applied — update fetch-live-intel.js.');
              console.log('   Feed has ' + items.length + ' items — treating as operational.');
              console.log('✅ Freshness check PASSED (advisory mode — no pipeline timestamps)');
              process.exit(0);
            }

            const ageMinutes = Math.floor((Date.now() - freshnessDate.getTime()) / 60000);

            console.log('Freshness ref  : ' + freshnessSource);
            console.log('Timestamp      : ' + freshnessDate.toISOString());
            console.log('Age (minutes)  : ' + ageMinutes);

            // Pipeline runs every 5 min — thresholds account for GitHub Actions scheduling jitter.
            // WARN at 90 min, FAIL at 6 hours (pipeline truly down).
            if (ageMinutes > 360) {
              console.error('::error title=Pipeline Stale (CRITICAL)::Pipeline last ran ' + ageMinutes + ' minutes ago — SENTINEL APEX may have failed. Check Actions.');
              process.exit(1);
            } else if (ageMinutes > 90) {
              console.log('::warning title=Pipeline Delay::Pipeline last ran ' + ageMinutes + ' minutes ago — monitor for continued delays.');
              console.log('✅ Feed operational (delayed but within recovery window)');
            } else {
              console.log('✅ Pipeline fresh — last run ' + ageMinutes + ' minutes ago');
            }
          " 2>&1

          echo "✅ Freshness check complete"

      - name: "Alert on failure"
        if: failure()
        run: |
          echo "::error title=SENTINEL APEX Feed Alert::Intel feed may be stale or unreachable. Manual trigger: https://github.com/cyberdudebivash/cyberdudebivash-blog/actions/workflows/sentinel-apex.yml"
          echo "Timestamp: $(date -u '+%Y-%m-%dT%H:%M:%SZ')"
