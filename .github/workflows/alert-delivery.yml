name: "📨 SENTINEL APEX — Watchlist Alert Delivery"

# Autonomous Alert Orchestration v1. Runs evaluate-watchlist-changes.js
# then deliver-watchlist-notifications.js on a schedule, replacing the
# "run manually" posture both scripts previously documented in their own
# headers (scripts/evaluate-watchlist-changes.js, scripts/deliver-
# watchlist-notifications.js -- both still true about WHY: wrangler.jsonc
# explicitly defers Cloudflare Cron Trigger authority pending separate
# operator authorization, so this uses infrastructure already proven
# reliable in this exact repo instead: freshness-check.yml and
# sentinel-apex.yml already run natively on a 30-minute `schedule:`
# cadence without issue. api/cron/dispatch-intel.js's own comment
# documents that GitHub's native scheduler is UNRELIABLE below roughly
# 30 minutes ("observed: 5-30 minute schedules firing every ~4h in
# practice") -- so 30 minutes here is the fastest cadence this repo's own
# evidence supports trusting, not an arbitrary choice. This defines the
# real internal delivery SLO: a dispatch attempt within ~30 minutes of a
# change becoming eligible, never claimed as real-time.
#
# Scope note: this workflow schedules BOTH change evaluation and alert
# delivery, not delivery alone. Scheduling delivery without evaluation
# would leave the customer-facing "you get alerted automatically when a
# tracked CVE's KEV status flips" promise still false end-to-end (nothing
# would create new events to deliver) -- the two scripts already share an
# identical CLI-wrapper shape, so covering both here is one extra `run`
# line, not a parallel mechanism.
#
# Concurrency (not correctness): cancel-in-progress:false makes an
# overlapping invocation WAIT rather than run in parallel, which reduces
# how often the application-level safety net below is even exercised.
# It is not a substitute for that safety net -- GitHub Actions can still
# retry a job, a run can still overlap a manual workflow_dispatch, and a
# runner can still die mid-job. The actual at-least-once-safe guarantee
# is api/_lib/notification-store.js's atomic SET-NX-PX delivery claim
# (see notification-dispatch.js's processDueDeliveries() doc) -- true
# regardless of what triggers it or how many times.
#
# Required GitHub Actions repository secrets: UPSTASH_REDIS_REST_URL,
# UPSTASH_REDIS_REST_TOKEN. As of this workflow's introduction it is
# UNVERIFIED whether these are already configured as GitHub Actions
# secrets specifically (a different secret store from the Vercel
# environment variables of the same name that already back production
# today) -- backup-customer-data.yml hit this exact gap first and
# documented it. Mirrors that workflow's own preflight-and-skip pattern:
# if unset, this runs, detects it, and exits with a visible warning
# rather than failing confusingly on every scheduled run.
# RESEND_API_KEY is passed through if configured but not required --
# deliver-watchlist-notifications.js already handles its absence
# gracefully (email deliveries fail soft as EMAIL_NOT_CONFIGURED and
# retry/dead-letter like any other failure; webhook delivery is
# unaffected), so no separate preflight gate is needed for it.
#
# --limit=50 on the deliver step (found via a local scale measurement,
# not guessed): processDueDeliveries() runs sequentially, and each
# webhook attempt can take up to WEBHOOK_TIMEOUT_MS=8s before giving up.
# notification-store.js's own getDuePendingDeliveries() already hard-caps
# a single call to 500 records regardless of the limit requested -- but
# 500 sequential worst-case timeouts is 500*8s=~67 minutes, far past this
# job's timeout-minutes. 50 keeps the worst case at ~7 minutes, leaving
# headroom for the evaluate step and checkout/setup within the 15-minute
# budget below.

on:
  schedule:
    - cron: '*/30 * * * *' # Every 30 minutes -- see cadence note above
  workflow_dispatch:

concurrency:
  group: alert-delivery
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  alert-delivery:
    name: "Evaluate watchlist changes and deliver due alerts"
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: "📥 Checkout"
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: "🟢 Set up Node.js"
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: "🔍 Check required secrets are configured"
        id: preflight
        env:
          HAS_REDIS_URL: ${{ secrets.UPSTASH_REDIS_REST_URL != '' }}
          HAS_REDIS_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN != '' }}
        run: |
          if [ "$HAS_REDIS_URL" = "true" ] && [ "$HAS_REDIS_TOKEN" = "true" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "ready=false" >> "$GITHUB_OUTPUT"
            echo "::warning::Alert delivery skipped — UPSTASH_REDIS_REST_URL / UPSTASH_REDIS_REST_TOKEN are not configured as GitHub Actions repository secrets yet. Same values already used in Vercel's environment (a different secret store) need to be added here too before this workflow can run."
          fi

      - name: "🔎 Evaluate watchlist changes"
        if: steps.preflight.outputs.ready == 'true'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
        run: node scripts/evaluate-watchlist-changes.js

      - name: "📨 Deliver due alerts"
        if: steps.preflight.outputs.ready == 'true'
        env:
          UPSTASH_REDIS_REST_URL: ${{ secrets.UPSTASH_REDIS_REST_URL }}
          UPSTASH_REDIS_REST_TOKEN: ${{ secrets.UPSTASH_REDIS_REST_TOKEN }}
          RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
        run: node scripts/deliver-watchlist-notifications.js --limit=50
